{% extends 'base.html' %}{% block title %}Add branch{% endblock %}{% block section %}BRANCHES / NEW{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">BRANCH DIRECTORY / NEW RECORD</div><h1>Add a branch</h1><p>Register a branch location and its unique IFSC code.</p></div><a class="text-link" href="{{ url_for('branches') }}">← Back to branches</a></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Branch name <span>*</span><input name="branch_name" required maxlength="100" value="{{ request.form.get('branch_name','') }}"></label><label>IFSC code <span>*</span><input name="ifsc" required minlength="11" maxlength="11" pattern="[A-Za-z]{4}0[A-Za-z0-9]{6}" placeholder="ABCD0123456" value="{{ request.form.get('ifsc','') }}"></label><label class="span-2">Address <span>*</span><input name="address" required maxlength="255" value="{{ request.form.get('address','') }}"></label><label>City <span>*</span><input name="city" required maxlength="80" value="{{ request.form.get('city','') }}"></label><label>State <span>*</span><input name="state" required maxlength="80" value="{{ request.form.get('state','') }}"></label><label>Contact number <span>*</span><input name="contact" required maxlength="20" value="{{ request.form.get('contact','') }}"></label></div><div class="form-actions"><span class="required-note">* Required fields</span><a class="button button-quiet" href="{{ url_for('branches') }}">Cancel</a><button class="button button-dark" type="submit">Save branch →</button></div></form>
{% endblock %}
